# SERVE behind nginx — one domain. Include this file inside the `http { }`
# block (e.g. /etc/nginx/conf.d/serve.conf).
#
# Replace YOUR_DOMAIN everywhere and provide a certificate (for example with
# certbot: `certbot certonly --nginx -d YOUR_DOMAIN`). The backend serves
# everything: /, /staff/, /admin/, /api and /socket.io (WEB_ROOT set, see
# docs/deployment.md); nginx terminates TLS, forwards, and passes WebSocket
# upgrades for Socket.IO. Run the backend with TRUST_PROXY=1.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# IPv4 only, so the file works on hosts without IPv6. With IPv6, add
# `listen [::]:80;` and `listen [::]:443 ssl http2;` next to the IPv4 lines.
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    # `listen … http2` works on every nginx; 1.25.1+ also accepts `http2 on;`.
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # The API accepts JSON bodies of at most 100 KB.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json
               application/manifest+json application/wasm image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket.IO (/socket.io/) upgrades to a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Longer than Socket.IO's 25 s ping interval.
        proxy_read_timeout 75s;
    }
}
